services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting}
      DATABASE_URL: sqlite:////app/instance/ecommerce.db
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    volumes:
      - instance_data:/app/instance
      - logs_data:/app/logs
      - uploads_data:/app/app/static/uploads
      - models_data:/app/app/static/models/products

volumes:
  instance_data:
  logs_data:
  uploads_data:
  models_data: