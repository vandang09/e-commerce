{% extends 'base.html' %}{% block title %}Join Morrow Market{% endblock %}{% block content %}<section class="auth-page"><div class="auth-aside"><p class="eyebrow">Find your everyday favorite</p><h1>Make room<br>for <em>good things.</em></h1><p>One account for the finds, the makers, and the little shops worth knowing.</p></div><form class="auth-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">Start here</p><h2>Create account</h2><label>Username<input name="username" required minlength="3" maxlength="40" autocomplete="username"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><label>Confirm password<input name="confirm_password" type="password" required minlength="8" autocomplete="new-password"></label><button class="button button-dark button-full">Join Morrow ↗</button><p class="auth-switch">Already a member? <a href="{{ url_for('auth.login') }}">Log in</a></p></form></section>{% endblock %}
